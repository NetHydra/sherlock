name: Build nethydra-wallpapers package

on:
  push:
    branches:
      - nethydra/master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y debmake debhelper-compat packaging-dev

      - name: Build package
        run: |
          dpkg-buildpackage -nc -i
